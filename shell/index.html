<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>JARVIS</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- First run, or after "Change server": the one page bundled in the app. Everything else is the live page on the Mac. -->
<form id="setup" class="card" autocomplete="off">
  <h1>J.A.R.V.I.S.</h1>
  <p>Where is JARVIS? Use the Mac's Tailscale address, the one you'd open in Safari.</p>
  <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
    placeholder="https://your-mac.your-tailnet.ts.net" aria-label="Server address" required>
  <button type="submit">Connect</button>
  <p id="error" role="alert"></p>
  <p class="hint">You can change it later: on iPhone in Settings → JARVIS, on Android by long-pressing the app icon.</p>
</form>
<script src="setup.js"></script>
</body>
</html>
