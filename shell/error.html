<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Alfred</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- server.errorPath, shown when the Alfred page doesn't load. The plugin handles the links natively, since on
     Android this page gets no Capacitor bridge. -->
<div class="card">
  <h1>Can't reach Alfred</h1>
  <p>Check that Tailscale is on, on this phone and on the Alfred computer, and that the computer is awake.</p>
  <a class="button" href="alfred-app://retry">Try again</a>
  <a class="link" href="alfred-app://setup">Change server</a>
</div>
</body>
</html>
