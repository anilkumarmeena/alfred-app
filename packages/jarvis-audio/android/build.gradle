// The JarvisAudio plugin's Android library. `npx cap sync` includes it in the app as :jarvis-audio.
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    livekitVersion = project.hasProperty('livekitVersion') ? rootProject.ext.livekitVersion : '2.29.0'
}

buildscript {
    ext.kotlin_version = project.hasProperty('kotlin_version') ? rootProject.ext.kotlin_version : '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.anil.jarvis.audio"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lint {
        abortOnError = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }  // LiveKit's audioswitch fork
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:${project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'}"
    implementation "io.livekit:livekit-android:$livekitVersion"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // JARVIS's alerts (PushNotifications). Starts only in an app built with a google-services.json.
    implementation "com.google.firebase:firebase-messaging:${project.hasProperty('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '24.1.0'}"
    testImplementation "junit:junit:$junitVersion"
}
